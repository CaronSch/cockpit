<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The keyboard shrinks the layout instead of covering it, so the message box stays above it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <title>Cockpit</title>
    <meta name="theme-color" content="#131317" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='3' width='10' height='10' rx='2' fill='%23808aff'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Inter:opsz,wght@14..32,400..600&display=swap"
    />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/app.css" />
    <link rel="stylesheet" href="styles/omp.css" />
    <link rel="stylesheet" href="styles/sessions.css" />
    <link rel="stylesheet" href="styles/phone.css" />
    <!-- Bare imports of dependencies resolve to the files the daemon serves for them (as in index.html). -->
    <script type="importmap">
      { "imports": { "temml": "/vendor/temml.mjs" } }
    </script>
    <script type="module" src="src/phone.js"></script>
  </head>
  <body>
    <div class="phone">
      <header class="phone-bar">
        <button type="button" class="phone-back" aria-label="Back to the sessions" hidden>‹</button>
        <h1 class="phone-title"></h1>
        <button type="button" class="phone-work" aria-pressed="false" hidden>Show work</button>
        <div class="phone-actions"></div>
      </header>
      <p class="phone-status" role="status" hidden></p>
      <main class="phone-view"></main>
    </div>
  </body>
</html>
